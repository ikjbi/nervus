[project]
name = "nervus"
version = "0.1.0.dev0"
description = "Open-source block-diagram modeling and simulation in Python — a Simulink alternative aimed at ECU control software."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Johan Bjoerk", email = "johan.bjoerk1@gmail.com" }]
requires-python = ">=3.11"
keywords = ["simulation", "block diagram", "control systems", "simulink", "ecu", "model-based design"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
gui = ["PySide6>=6.7", "pyqtgraph>=0.13"]

[project.urls]
Homepage = "https://github.com/ikjbi/nervus"
Issues = "https://github.com/ikjbi/nervus/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]
docs = [
    "mkdocs-material>=9.5",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nervus"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N"]
# Math symbols (×, τ, ·) in docstrings are intentional.
ignore = ["RUF001", "RUF002"]

[tool.ruff.lint.per-file-ignores]
# Matrix names A, B, C, D follow control-theory convention.
"src/nervus/blocks/continuous.py" = ["N806"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = false
files = ["src/nervus"]

[[tool.mypy.overrides]]
module = ["scipy.*", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
