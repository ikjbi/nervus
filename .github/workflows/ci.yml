name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Ubuntu only while the repo is private (macOS/Windows runners burn the free minutes 10x/2x faster).
    # Add macos-latest and windows-latest to the matrix once the repo is public.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: System libraries for Qt (headless)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install
        run: uv sync --extra gui --python ${{ matrix.python-version }}
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          NERVUS_HARD_EXIT: "1"
        # PySide6 6.12 aborts intermittently on Python 3.11 in headless CI (a refcount bug inside PySide);
        # the GUI tests therefore run on 3.13 only. The engine, codegen and SIL tests run on every version.
        run: |
          if [ "${{ matrix.python-version }}" = "3.11" ]; then
            uv run pytest --ignore=tests/gui --cov=nervus --cov-report=term
          else
            uv run pytest --cov=nervus --cov-report=term
          fi
