name: CI

# Runs when code changes (not for docs-only pushes), for pull requests, weekly and on demand (Actions tab > CI > Run
# workflow). A newer push cancels the run of an older one. A commit message with [skip ci] skips CI altogether.
on:
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "examples/**", "pyproject.toml", "uv.lock", ".github/workflows/ci.yml"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"  # Mondays 03:00 UTC

concurrency:  # a newer push cancels the run still going for an older one
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true  # the downloaded packages (PySide6, scipy, ...) are reused between runs
      - name: System libraries for Qt (headless)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 cppcheck
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install
        run: uv sync --extra gui --extra can --extra mdf --extra fmi --python ${{ matrix.python-version }}
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          NERVUS_HARD_EXIT: "1"
        # PySide6 6.12 aborts intermittently on Python 3.11 in headless CI (a refcount bug inside PySide);
        # the GUI tests therefore run on 3.13 only. The engine, codegen and SIL tests run on every version.
        run: |
          if [ "${{ matrix.python-version }}" = "3.11" ]; then
            uv run pytest --ignore=tests/gui
          else
            uv run pytest
          fi
