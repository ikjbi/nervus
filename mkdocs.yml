site_name: Nervus
site_description: Open-source block-diagram modeling and simulation in Python
repo_url: https://github.com/ikjbi/nervus
theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/brightness-7, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/brightness-4, name: Light mode }
markdown_extensions:
  - admonition
  - pymdownx.arithmatex: { generic: true }
  - pymdownx.highlight
  - pymdownx.superfences
  - toc: { permalink: true }
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
nav:
  - Home: index.md
  - User guide:
      - Getting started: getting-started.md
      - The editor: editor.md
      - Workspace and calibrations: workspace.md
      - Subsystems: subsystems.md
      - Component libraries: libraries.md
      - Data types and fixed point: datatypes.md
      - State machines: statecharts.md
      - CAN communication: can.md
      - OBD-II live data: obd.md
      - Linear analysis: analysis.md
      - C code generation: codegen.md
      - Test cases and results: testing.md
      - Coverage and Model Advisor: verification.md
      - In-app help pages:
          - Getting started (app): app-help/getting_started.md
          - Using the editor: app-help/editor.md
          - Running simulations: app-help/simulation.md
          - Workspace and calibrations: app-help/workspace.md
          - Subsystems: app-help/subsystems.md
          - Component libraries: app-help/libraries.md
          - Data types and fixed point: app-help/datatypes.md
          - State machines: app-help/statecharts.md
          - CAN communication: app-help/can.md
          - OBD-II live data: app-help/obd.md
          - Linear analysis: app-help/analysis.md
          - C code generation: app-help/codegen.md
          - Test cases and the Data Inspector: app-help/testing.md
          - Coverage and Model Advisor: app-help/verification.md
          - "Tutorial: idle speed control": app-help/tutorial_idle.md
          - "Tutorial: lambda control": app-help/tutorial_lambda.md
          - Keyboard shortcuts: app-help/shortcuts.md
      - Concepts: concepts.md
      - Coming from Simulink: coming-from-simulink.md
      - Model files: model-files.md
  - Tutorials:
      - Idle speed control: tutorials/idle-speed-control.md
      - Lambda control and fuel trims: tutorials/lambda-control.md
  - Block reference:
      - Overview: blocks/index.md
      - CAN: blocks/can.md
      - Sources: blocks/sources.md
      - Math Operations: blocks/math-operations.md
